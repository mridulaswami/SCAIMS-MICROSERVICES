spring:
  application:
    name: SCAIMS-API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: scaims-asset-service
              uri: lb://scaims-asset-service
              predicates:
                - Path=/scaims-asset-service/**
            - id: user-management-service
              uri: lb://user-management-service
              predicates:
                - Path=/user-management-service/**
            - id: scaims-user-service
              uri: lb://scaims-user-service
              predicates:
                - Path=/scaims-user-service/**
            - id: scaims-complaint-service
              uri: lb://scaims-complaint-service
              predicates:
                - Path=/scaims-complaint-service/**

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  opt:
    exprired-at: 5

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


app:
  jwt:
    secret: your-256-bit-secret-key-change-in-production-must-be-at-least-32-chars
    access-token-expiration-ms: 300000
    refresh-token-expiration-ms: 3600000
